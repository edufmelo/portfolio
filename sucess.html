<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagem enviada - Eduardo Melo</title>
    <link rel="icon" type="image/png" href="/assets/logo/white-logo.png" />
    <link rel="stylesheet" href="/src/global.css" />

    <!-- FONTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@100..800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="success-body">
    <main>
      <section class="success-page">
        <a class="success-logo" href="/" aria-label="Voltar ao portfólio">
          <img src="/assets/logo/white-logo-adjusted.png" alt="Eduardo Melo" />
        </a>

        <div class="success-ring success-ring-one" aria-hidden="true"></div>
        <div class="success-ring success-ring-two" aria-hidden="true"></div>

        <div class="success-card">
          <span class="success-status" aria-hidden="true">✓</span>
          <p class="success-eyebrow">Mensagem enviada</p>
          <h1>Obrigado pelo contato.</h1>
          <p class="success-message">
            Recebi sua mensagem e responderei assim que possível.
          </p>

          <a class="success-back" href="/">
            <span>Voltar ao portfólio</span>
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
